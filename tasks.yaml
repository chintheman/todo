  name: Agentic Marketing Concierge
  kind: project
  items:
  - id: agentic-concierge-architecture
    title: 'Agentic Marketing Concierge — architecture decision: Hermes ops ring vs Hermes-profile rebuild'
    type: discuss
    domain: gtm
    priority: p0
    status: active
    summary: 'The Marketing Concierge bot (@testingsteambot) is a standalone python-telegram-bot polling process on the M1.
      Hermes integration today is a single every-3m watchdog cron (635e409d4024) that restarts it. Discussion mapped how Hermes
      bot mode (gateway) could apply. Route A (recommended): keep standalone, bolt a Hermes ops ring around it — campaign
      end-date alerts, weekly portfolio digest, local data backup. Zero risk to a live tool Glenn depends on. Route B: rebuild
      the concierge as a Hermes profile (second gateway bot token + skills encoding the 12 formatting rules, KB, data layer)
      — gains native memory, cron, voice, delegation, multi-platform, but rewrites a live tool. Verdict on record: Route A
      delivers ~80% of the value at ~zero risk. Gaps the concierge lacks that bot mode provides: scheduler (no cron), cross-session
      memory (flat JSON per chat), multi-platform (Telegram-only), research depth (URL scraping only).'
    captured: 2026-08-18
    source: Telegram Aug 18 2026 — Hermes bot-mode application discussion
    notes: 'Repos: github.com/chintheman/concierge-bot-app (app), github.com/chintheman/concierge-bot (skill). Skill: concierge-bot.
      Watchdog cron 635e409d4024.'
    gist: Decide whether the concierge stays standalone with a Hermes ops ring around it or rebuilds as a Hermes profile.
    next_step: Review Route A and Route B in the summary and pick the architecture direction for the concierge.
    cluster: Agentic Marketing Concierge
    cluster_emoji: 🛎️
    cluster_kind: project
  - id: agentic-concierge-campaign-alerts
    title: Concierge ops ring — campaign end-date alert cron
    type: discuss
    domain: gtm
    priority: p0
    status: active
    summary: 'The concierge data layer already stores campaigns per client with end_date and status (data/clients/{slug}/campaigns/{id}.json).
      The concierge itself has no scheduler, so nothing fires on campaign deadlines today. Proposal: a no_agent Hermes cron
      that reads the data layer and nudges when a campaign is within T-14/T-7 of its end date or overdue. Delivered to the
      concierge working chat. Cost ~zero, no changes to bot.py. Part of Route A ops ring.'
    captured: 2026-08-18
    source: Telegram Aug 18 2026 — Hermes bot-mode application discussion
    notes: 'Data layer: data_layer.py list_campaigns()/get_campaign(). Repo: github.com/chintheman/concierge-bot-app.'
    gist: A cron that nudges when a tracked campaign approaches its end date.
    next_step: Approve alert timing (T-14 and T-7) and delivery target for campaign end-date nudges.
    cluster: Agentic Marketing Concierge
    cluster_emoji: 🛎️
    cluster_kind: project
  - id: agentic-concierge-backup
    title: Concierge ops ring — local data backup (client data is gitignored)
    type: discuss
    domain: gtm
    priority: p0
    status: active
    summary: 'Client data (data/ directory) is gitignored in concierge-bot-app for privacy — correct, since briefs, histories,
      strategies, and campaigns are private — but that means zero redundancy for a live tool. Proposal: a local backup cron
      archiving data/ + Knowledge Base/ to a timestamped archive and retaining the last N copies. Never push client data to
      GitHub. Part of Route A ops ring.'
    captured: 2026-08-18
    source: Telegram Aug 18 2026 — Hermes bot-mode application discussion
    notes: '.gitignore excludes data/clients/, data/archive/, data/users.json. Repo: github.com/chintheman/concierge-bot-app.'
    gist: A scheduled local backup for concierge client data.
    next_step: Approve the backup target and retention window for concierge client data.
    cluster: Agentic Marketing Concierge
    cluster_emoji: 🛎️
    cluster_kind: project
  - id: agentic-concierge-portfolio-digest
    title: Concierge ops ring — weekly client portfolio digest
    type: discuss
    domain: gtm
    priority: p0
    status: active
    summary: 'Weekly portfolio digest cron: reads the concierge data layer across all clients — brief presence, strategy counts,
      campaign statuses (active/completed/planned) — and delivers a scannable summary to the working chat. The concierge has
      no scheduler of its own; Hermes cron supplies the cadence. Part of Route A ops ring.'
    captured: 2026-08-18
    source: Telegram Aug 18 2026 — Hermes bot-mode application discussion
    notes: 'Data: data/users.json + data/clients/*. Repo: github.com/chintheman/concierge-bot-app.'
    gist: A weekly summary of all clients, strategies, and campaign statuses.
    next_step: Approve digest contents and delivery cadence for the weekly concierge portfolio report.
    cluster: Agentic Marketing Concierge
    cluster_emoji: 🛎️
    cluster_kind: project
  - id: agentic-concierge-multiplatform
    title: Concierge reach — WhatsApp or multi-platform for Glenn
    type: discuss
    domain: gtm
    priority: p0
    status: active
    summary: 'The concierge is Telegram-only (@testingsteambot). Glenn is a Singapore business owner; WhatsApp is his likely
      lane. openwa-eval (done Jul 17 2026) evaluated OpenWA — a free self-hosted WhatsApp API gateway (REST, webhooks, multi-session)
      — explicitly flagged "and/or concierge bot". Decision: whether multi-platform reach is worth it, and via which path
      (OpenWA self-host vs WhatsApp Cloud API, which closed to general-purpose AI Jan 15 2026 and charges service-message
      fees from Oct 1 2026).'
    captured: 2026-08-18
    source: Telegram Aug 18 2026 — Hermes bot-mode application discussion
    notes: 'Related: openwa-eval (parked in this product). Findings: pending file in openwa-eval entry.'
    gist: Decide whether the concierge should reach Glenn on WhatsApp or stay Telegram-only.
    next_step: Review OpenWA findings and decide if WhatsApp is the right next channel for Glenn.
    cluster: Agentic Marketing Concierge
    cluster_emoji: 🛎️
    cluster_kind: project
