  - id: pal-delta-neutral-token
    title: PAL — Delta-Neutral Polymarket Token (dn-token-polymarket)
    type: build
    domain: crypto
    priority: p1
    status: active
    summary: 'Token ($PAL, Polymarket Abstraction Layer) = NAV share of a delta-neutral Polymarket market-making strategy.
      Users mint USDC→PAL; agentic engine quotes two-sided limit orders farming Polymarket''s maker-reward budget (~$60.4M/yr);
      CTF merge keeps book delta-neutral; profits stream to a withdrawal pool, claimable pro-rata by supply. Repo: github.com/chintheman/dn-token-polymarket
      (PRIVATE), ~/projects/delta-neutral-token. Key findings: intra-market pair arb dead (0/349 markets); reward-budget MM
      is the real yield (~92% APR @ $10k, 51% @ $100k, 27% @ $1M gross); SG GRA blocks Polymarket so backtest/live-sim only,
      no real capital. Decisions: stable-yield NAV token, all 3 capital scales run simultaneously, capacity-based exposure,
      $PAL name.'
    captured: 2026-08-14
    source: User ideation session Aug 14 2026
    notes: 'Research: RESEARCH.md (Opus 5). Plan: PLAN.md (Opus 5, 1,050 lines, pushed Aug 14). Key plan moves: toxicity curve
      computed from OTHER makers on-chain fills (lawful from SG, zero capital — escapes the SG blocker); phase 1 = 3 weeks,
      $40/mo VPS, no capital, checkpoint C1 (+8% annualized distance region, R²≥0.80 reward regression); 5 open design items
      resolved (3-tier exit waterfall DEX→0.25% instant→10% weekly queue; par NAV marking; mint floor = revert not sell-below-par;
      20% fee split 30/30/30/10 treasury). Plan corrected 4 locked design elements (price-lock look-back option, mid-marking
      overstatement, $1-floor mis-selling, resolution-fee collects ~0).'
    gist: A token whose value tracks a delta-neutral Polymarket market-making strategy.
    next_step: Get Chin's counsel sign-off on SG lawfulness of the paper research.
