  - id: profile-isolation-deep-dive
    title: 'Discuss: Hermes profile isolation — config-level vs dedicated bot token'
    type: discuss
    domain: ai/ml
    priority: p1
    status: active
    summary: 'Hermes profiles are config-level (same process, same bot token, swapped config/SOUL.md/skills/memories), NOT
      separate agents. The profile: field in group_topics is silently ignored on Telegram — topics always run under whatever
      profile owns the bot token (normally default). True isolation requires a dedicated bot token per profile. Key implications:
      - Memory walls work (per-profile MEMORY.md/USER.md) - Different models/toolsets per profile work - But profiles share
      process, context tax, and gateway endpoint - No process isolation = one profile''s crash takes all Worth discussing:
      is this acceptable, or do we want true agent isolation?'
    captured: 2026-07-18
    source: PA session — user research into profile architecture
    notes: "Profile isolation tiers: Config-level (current): memory/sessions/skills isolated. Process/model/tools\n  shared.\
      \ One bot token. Default across all 12+ topics.\nCredential-level (ideal): dedicated bot token per profile. Separate\
      \ gateway,\n  separate model runtime. True process isolation.\nThe profile-creation skill (v2.x) confirms: profile:\
      \ field in group_topics\n  is silently ignored on Telegram in v0.18.0.\nOpen questions: Is the current config-level\
      \ isolation sufficient? When\n  would we need true isolation? Cost/overhead of multiple bot tokens?\nCross-ref: agency-agents\
      \ router and our 26 profile roster. UPDATE Aug 16 2026: execution started — see task profile-bot-fleet. market-intel\
      \ gateway live (cron-only until bot token wired)."
    gist: A discussion of whether Hermes profiles need dedicated bot tokens for true isolation.
    next_step: Discuss with Chin whether dedicated bot tokens per profile are worth the isolation.
    cluster: ai/ml
    cluster_emoji: ''
    cluster_kind: domain
  - id: graph-engineering-patterns
    title: Graph Engineering — nodes/edges, fake-edge test, diamond pattern, fresh-context checkers
    type: research
    domain: ai/ml
    priority: p2
    status: active
    summary: 'Long-form X article (4M views, 6.8K bookmarks) on graph-based agent orchestration. Core vocabulary: nodes (bounded
      jobs with input/output contracts) + edges (real data dependencies). Key tests/patterns: the fake-edge test (drop sequential
      waits that carry no data — parallelize), the diamond pattern (fan out → reduce in plain code → synthesize with a strong
      model), fresh-context checkers (a worker and its verifier must NEVER share context — otherwise it''s one loop grading
      its own homework), and anchors (nodes that cannot be argued with — tests that ran, revenue that landed). Failure modes:
      context collapse (layer your fan-in), false independence (shared files/rate-limited APIs = hidden edges), silent node
      failure (merge steps must count inputs). Includes ready-to-paste Claude Code "workflow" prompts and the Bun rewrite
      case study ($165K, 64 agents, 11 days).'
    captured: 2026-08-06
    source: X article by Anatoli Kopadze — https://x.com/anatolikopadze/status/2080668775796314331
    notes: 'Directly validates the reflexion-loop maker-checker design (fresh-context critic) and the crewai-orchestrator
      diamond shape. The fake-edge test is a good audit lens for existing multi-agent workflows. Caveat: graphs buy breadth,
      not judgment — skip for small/sequential/exploratory tasks.'
    gist: A study of graph engineering patterns for orchestrating multi-agent workflows.
    next_step: Run the fake-edge test across existing multi-agent workflows and fix sequential waits.
    cluster: ai/ml
    cluster_emoji: ''
    cluster_kind: domain
