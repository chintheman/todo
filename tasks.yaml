  - id: toto-automated-betting
    title: Research automated TOTO bet placement — 100 quick picks without human intervention
    type: research
    domain: crypto
    priority: p2
    status: active
    summary: 'Research how to automatically place 100 Singapore Pools TOTO bets (quick picks or system entries) with zero
      human intervention. Investigate: (1) SG Pools digital API / web portal automation feasibility, (2) legal/ToS constraints
      on automated betting, (3) whether an agent can navigate the online betting flow (login → select game → place bets →
      confirm), (4) batch bet submission limits, (5) cost of 100 bets at $1/$2 each, (6) account funding automation. Cross-ref
      existing toto-strategy skill (1,193 draws analysed) and toto-generator-refine (P1) for the number generation side.'
    captured: '2026-07-07'
    source: 0xsteamboat request — automate TOTO execution pipeline
    notes: "RELATED:\n  - toto-strategy skill (analytics, 1,193 draws vs 13,983,816 combos)\n  - toto-generator-refine (P1\
      \ · build) — UX/productization of the picker\n  - This item is the EXECUTION/AUTOMATION layer, not the selection layer\n\
      \nKEY QUESTIONS FOR DEEP DIVE:\n  - Does SG Pools have an API or only a web portal?\n  - Can automated bets be placed\
      \ via headless browser?\n  - What's the per-bet minimum and max?\n  - Account funding — recurring top-up from bank?\n\
      \  - ToS violation risk (automated gambling)?\n  - Legal status: automated betting in Singapore?\n  - Practical: 100\
      \ quick picks at $1 = $100 per draw"
    gist: Research into automatically placing TOTO bets with Singapore Pools and no human in the loop.
    next_step: Research SG Pools digital API and ToS constraints on automated betting.
    cluster: Toto
    cluster_emoji: 🎱
    cluster_kind: project
