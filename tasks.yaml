  - id: ig-carousel-frameworks
    title: Absorb 5 IG carousel frameworks into Creative Agency pipeline
    type: research
    domain: creative
    priority: p1
    status: active
    summary: "5 slide-by-slide carousel frameworks for Instagram: (A) VALUE-STACK (4-14 slides) — exact count + deliverable upfront,\n    one category per slide, close with CTA.\n(B) PROBLEM-PROOF (6-10 slides) — personal hook → reframe problem →\n    named mechanism/tools → literal prompt detail → proof/output screenshot.\n(C) HACK LIST (6-10 slides) — contrarian hook implying failure →\n    numbered hacks with bad-vs-good per slide → synthesis CTA.\n(D) RANT CALLOUT (4-8 slides) — provocative claim → escalate →\n    fairness pivot → personality sign-off.\n(E) DEMO WALKTHROUGH (3-11 slides) — product + finished output →\n    problem it solves → numbered process overview → step-by-step UI\n    screenshots → result + positioning.\nEach framework includes exact slide count ranges, slide-by-slide templates, and example language. Directly applicable to Creative Agency carousel pipeline — can framework-match each brief to the best structure for the content type."
    captured: '2026-07-10'
    source: '@vibemarketersHQ on X (Jul 9, 2026) — 5 frameworks reverse-engineered from 500+ carousels'
    notes: 'Source: x.com/vibemarketershq/status/2075278813437800450 Image: ~/.hermes/image_cache/img_851cd6508a16.jpg RELEVANCE: We have carousels-mcp (11 slide types) and creative-agency pipeline. These 5 frameworks can be mapped to carousels-mcp slide types and integrated as brief-to-framework routing logic. Each framework is a proven structure — use to decide which carousel format fits the content objective rather than defaulting to one.'
    cluster: Creative Agency & Content
    quadrant: Q2
