  - id: graph-engineering-patterns
    title: Graph Engineering — nodes/edges, fake-edge test, diamond pattern, fresh-context checkers
    type: research
    domain: ai/ml
    priority: p2
    status: active
    summary: 'Long-form X article (4M views, 6.8K bookmarks) on graph-based agent orchestration. Core vocabulary: nodes (bounded jobs with input/output contracts) + edges (real data dependencies). Key tests/patterns: the fake-edge test (drop sequential waits that carry no data — parallelize), the diamond pattern (fan out → reduce in plain code → synthesize with a strong model), fresh-context checkers (a worker and its verifier must NEVER share context — otherwise it''s one loop grading its own homework), and anchors (nodes that cannot be argued with — tests that ran, revenue that landed). Failure modes: context collapse (layer your fan-in), false independence (shared files/rate-limited APIs = hidden edges), silent node failure (merge steps must count inputs). Includes ready-to-paste Claude Code "workflow" prompts and the Bun rewrite case study ($165K, 64 agents, 11 days).'
    captured: 2026-08-06
    source: X article by Anatoli Kopadze — https://x.com/anatolikopadze/status/2080668775796314331
    notes: 'Directly validates the reflexion-loop maker-checker design (fresh-context critic) and the crewai-orchestrator diamond shape. The fake-edge test is a good audit lens for existing multi-agent workflows. Caveat: graphs buy breadth, not judgment — skip for small/sequential/exploratory tasks.'
    cluster: Agent Orchestration & Loops
    quadrant: Q4
