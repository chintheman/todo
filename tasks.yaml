  - id: grief-management-voice-journal
    title: Grief Management — private voice journal website/app
    type: build
    domain: business/build
    priority: p3
    status: active
    summary: 'Build a grief management tool: private voice journal where users speak thoughts on-device. Inspired by Slate
      (iOS voice journal, no server, on-device reflection + weekly recaps). Key differentiator: purpose-built for grief processing,
      not general journaling. Voice-first, private by default, on-device AI that notices patterns in what the user repeats
      or shifts over time.'
    captured: 2026-07-23
    source: User idea + Slate private journal app reference - https://apps.apple.com/us/app/slate-private-journal/id6787531627
    notes: 'REFERENCE APP: Slate - Private Journal URL: https://apps.apple.com/us/app/slate-private-journal/id6787531627 Developer:
      hsla0001. Price: $7.99/mo or $59.99/yr (1 month free trial). Size: 3 MB. Platform: iOS 26+ (iPhone only). Rating: 5.0.

      KEY FEATURES: Voice journal, no server, on-device. Press record and speak. On-device reflection: what it was about,
      how it sat, one observation worth keeping. "Never advice, never a chat." Weekly recap (Sundays): what repeated, what
      shifted. No streaks, no scores. Optional encrypted iCloud backup. Privacy: "Data Not Collected." Works on airplane mode.
      Lock Screen + Dynamic Island timer.

      GRIEF DIFFERENTIATORS: guided prompts for grief stages, memory capture (photos/voice notes about the person), anniversary
      reminders, optional trusted circle sharing, crisis resource integration.

      COMPETITORS: Say It Anyway (Grief Journal), Solace (Grief and Loss Journal with memorial cards + crisis support), Good
      Grief (Journal and Vault with shared memory vault), Heartchive (end-to-end encrypted, caregiving + grief paths).

      Sibling to nicest-place-website and looking-busy-website in the business/build portfolio.'
    gist: A private voice journal app purpose-built for grief processing, with on-device reflection.
    next_step: 'Scope the MVP: on-device voice recording plus weekly pattern recap.'
    cluster: Grief 'Management'
    cluster_emoji: 💔
    cluster_kind: project
